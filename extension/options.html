<!doctype html>
<meta charset="utf-8">
<title>fone settings</title>
<style>
  body { font: 14px/1.5 system-ui, -apple-system, "PingFang SC", sans-serif; max-width: 560px; margin: 32px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 20px; } label { display: block; margin-top: 18px; font-weight: 600; }
  textarea, select { width: 100%; box-sizing: border-box; font: 13px ui-monospace, monospace; padding: 6px; margin-top: 4px; }
  .hint { color: #666; font-size: 12.5px; font-weight: 400; }
  button { margin-top: 18px; padding: 6px 14px; font: inherit; cursor: pointer; }
  #out { margin-top: 12px; white-space: pre-wrap; font: 12.5px ui-monospace, monospace; }
  table { border-collapse: collapse; margin-top: 8px; font-size: 13px; } td { padding: 2px 10px 2px 0; }
</style>
<h1>fone — F1 TV × 解说 sync</h1>

<label>Server URLs <span class="hint">— one per line, tried in order (e.g. a Tailscale name first so it works away from home)</span>
  <textarea id="servers" rows="3" placeholder="http://your-server:8788"></textarea></label>

<label>Commentary channel <span class="hint">— recorder folder name; empty = whichever was recorded most recently</span>
  <select id="channel"><option value="">(most recent)</option></select></label>

<label><input type="checkbox" id="autoHold"> Live: pause F1 TV while it's ahead of the commentary</label>

<button id="save">Save</button> <button id="test">Test connection</button>
<div id="out"></div>

<h1 style="margin-top:32px">Hotkeys on F1 TV</h1>
<table>
  <tr><td><b>]</b> / <b>[</b></td><td>commentary 0.5 s sooner / later</td></tr>
  <tr><td><b>}</b> / <b>{</b></td><td>commentary 5 s sooner / later</td></tr>
  <tr><td><b>\</b></td><td>mute / unmute commentary</td></tr>
  <tr><td><b>|</b></td><td>collapse / expand the panel</td></tr>
</table>
<script src="local.js"></script>
<script src="options.js"></script>
